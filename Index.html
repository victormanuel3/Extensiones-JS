<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="Index.js" defer></script>
</head>
<body>
    <div class="container">
        <div class="platform-buttons">
            <button id="facebook-btn" class="platform-btn active">
                <img src="./Images/Facebook.svg" alt="Facebook">
                <span>Facebook</span>
            </button>
            <button id="amazon-btn" class="platform-btn">
                <img src="./Images/Amazon.svg" alt="Amazon">
                <span>Amazon</span>
            </button>
        </div>

        <div id="facebook-options" class="options active">
            <button id="set-background-red" class="action-button">Set background color red</button>
            <div class="color-picker-container">
                <div class="color-input-wrapper">
                    <input type="color">
                </div>
                <button id="set-color-links" class="action-button" style="max-width: 180px;">Set color links</button>
            </div>
            <button id="remove-images" class="action-button">Borrar images</button>
            <button id="show-hidden" class="action-button">Mostrar / Ocultar</button>
        </div>

        <div id="amazon-options" class="options">
            <button id="show-alt-image" class="action-button">Show ALT image</button>
        </div>
    </div>
</body>
</html>
